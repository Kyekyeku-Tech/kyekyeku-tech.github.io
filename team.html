<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Meet the Kyekyeku Tech team and read what customers say about our digital services.">
  <title>Meet the Kyekyeku Tech Team</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172943;
      --muted: #64748b;
      --blue: #205eea;
      --line: #e4eaf3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #f7f9fc;
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 12px max(5vw, 22px);
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 750;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .brand strong {
      color: var(--blue);
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 22px;
      color: #4c5d75;
      font-size: 14px;
      font-weight: 600;
    }

    .site-nav a:hover {
      color: var(--blue);
    }

    .page-main {
      width: min(1050px, calc(100% - 40px));
      margin: 0 auto;
      padding: 62px 0 48px;
    }

    .page-intro {
      max-width: 650px;
      margin: 0 auto 34px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(34px, 5vw, 48px);
      letter-spacing: -0.045em;
    }

    .intro-copy {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 280px));
      justify-content: center;
      gap: 20px;
    }

    .team-card {
      padding: 27px 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(27, 47, 78, 0.06);
      text-align: center;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .team-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 42px rgba(27, 47, 78, 0.11);
    }

    .team-card img {
      width: 104px;
      height: 104px;
      margin: 0 auto 16px;
      border: 4px solid #eaf1ff;
      border-radius: 50%;
      object-fit: cover;
    }

    .team-card h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .team-card p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .team-card .team-company {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .testimonials {
      margin-top: 56px;
      padding: 34px clamp(20px, 5vw, 56px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(27, 47, 78, 0.05);
      text-align: center;
    }

    .testimonials h2 {
      margin: 0 0 22px;
      font-size: 25px;
      letter-spacing: -0.03em;
    }

    .testimonial-slide {
      max-width: 660px;
      min-height: 174px;
      margin: 0 auto;
      opacity: 1;
      transition: opacity 350ms ease;
    }

    .testimonial-slide.fade-out {
      opacity: 0;
    }

    .testimonial-slide img {
      width: 58px;
      height: 58px;
      margin: 0 auto 14px;
      border: 3px solid #eaf1ff;
      border-radius: 50%;
      object-fit: cover;
    }

    .testimonial-slide blockquote {
      margin: 0;
      color: #34445c;
      font-size: clamp(16px, 2.5vw, 20px);
      line-height: 1.6;
    }

    .testimonial-slide p {
      margin: 13px 0 0;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 560px) {
      .site-header {
        min-height: 64px;
        padding: 10px 16px;
      }

      .brand {
        font-size: 15px;
      }

      .brand img {
        width: 32px;
        height: 32px;
      }

      .site-nav {
        gap: 14px;
        font-size: 12px;
      }

      .page-main {
        width: min(100% - 28px, 460px);
        padding-top: 42px;
      }

      .card-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .team-card {
        max-width: 360px;
        width: 100%;
        margin: 0 auto;
      }

      .testimonials {
        margin-top: 36px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

const testimonialEl = document.getElementById('testimonial');
const imgEl = testimonialEl.querySelector('img');
const quoteEl = testimonialEl.querySelector('blockquote');
const nameEl = testimonialEl.querySelector('p');

function showRandomTestimonial() {
    const random = testimonialData[Math.floor(Math.random() * testimonialData.length)];

    // Fade out
    testimonialEl.classList.add('fade-out');

    setTimeout(() => {
        // Change content after fade out
        imgEl.src = random.img;
            imgEl.alt = random.name.replace(/^- /, "");
            quoteEl.textContent = random.quote;
            nameEl.textContent = random.name;

        // Fade back in
        testimonialEl.classList.remove('fade-out');
    }, 350);
}

// Initial load

// Change testimonials periodically without moving the page layout.
setInterval(showRandomTestimonial, 8000);
